[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diematic-modbus"
version = "0.1.0"
description = "Modbus RTU (over TCP) client for De Dietrich Diematic iSystem boilers with pluggable brokers (MQTT, Home Assistant)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "aiomqtt>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "amqtt>=0.11",
]

[project.scripts]
diematic = "diematic.cli:main"

[project.entry-points."diematic.plugins"]
mqtt = "diematic.plugins.mqtt.plugin:MqttPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/diematic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:Loading plugins from EntryPoints:DeprecationWarning",
    "ignore:sys_interval is deprecated:DeprecationWarning",
    "ignore:'auth' and 'topic-check' are deprecated:DeprecationWarning",
    "ignore:`BrokerSysPlugin`:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
