name: Diematic Modbus
version: "0.2.0"
slug: diematic_modbus
description: De Dietrich Diematic iSystem boilers in Home Assistant over Modbus RTU and MQTT
url: https://github.com/jakubkosinski/diematic_modbus_rtu
image: ghcr.io/jakubkosinski/diematic-modbus-app
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
services:
  - mqtt:want
map:
  - type: app_config
options:
  gateway_host: ""
  gateway_port: 20108
  map: diematic_isystem
  language: pl
  read_only: false
  trailing_zero: true
  fast_interval: 30
  slow_interval: 300
  clock_sync: false
  log_level: info
  mqtt_topic_prefix: diematic
  mqtt_discovery_prefix: homeassistant
  mqtt_boiler_availability: false
schema:
  gateway_host: str
  gateway_port: port
  map: str
  language: list(pl|en)
  disabled_registers: str?
  slave_address: int(1,247)?
  read_only: bool
  trailing_zero: bool
  fast_interval: int(1,3600)
  slow_interval: int(1,86400)
  clock_sync: bool
  log_level: list(debug|info|warning|error)
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
  mqtt_boiler_availability: bool
