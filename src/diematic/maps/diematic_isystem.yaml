system: diematic_isystem
name: De Dietrich Diematic iSystem
slave_address: 10

templates:
  temp_measure: &temp_measure {type: temp, kind: measure, unit: "°C", device_class: temperature, state_class: measurement}
  temp_setting: &temp_setting {type: temp, kind: parameter, unit: "°C", device_class: temperature}
  room_setpoint: &room_setpoint {min: 5, max: 30, step: 0.5, poll: fast}
  curve_slope: &curve_slope {type: uint, kind: parameter, scale: 0.1, min: 0, max: 4, step: 0.1}
  anticipation: &anticipation {type: uint, kind: parameter, scale: 0.1, unit: "°dH", min: 0, max: 10.1, step: 0.1}
  curve_base: &curve_base {min: 15, max: 90, step: 5}
  program_select: &program_select {type: enum, kind: parameter, values: {0: P1, 1: P2, 2: P3, 3: P4}}
  mode_values: &mode_values
    0: {pl: Ochrona przeciwzamrożeniowa, en: Frost protection}
    2: {pl: Noc, en: Night}
    4: {pl: Dzień, en: Day}
  circuit_modes: &circuit_modes {type: enum, kind: measure, values: *mode_values}
  forcing_bits: &forcing_bits
    frost_protection: {bit: 0, name: {pl: Ochrona przeciwzamrożeniowa, en: Frost protection}, writable: true}
    night: {bit: 1, name: {pl: Noc, en: Night}, writable: true}
    day: {bit: 2, name: {pl: Dzień, en: Day}, writable: true}
    auto: {bit: 3, name: {pl: Auto, en: Auto}, writable: true}
    dhw: {bit: 4, name: {pl: CWU, en: DHW}, writable: true}
    circuit_until_program_end: {bit: 5, name: {pl: Wymuszenie obiegu do końca programu, en: Circuit forcing until end of program}, writable: true}
    dhw_until_program_end: {bit: 6, name: {pl: Wymuszenie CWU do końca programu, en: DHW forcing until end of program}, writable: true}
    all_circuits: {bit: 7, name: {pl: Wymuszenie wszystkich obiegów, en: Forcing applies to all circuits}, writable: true}
  pool_circuit_types: &pool_circuit_types
    1: {pl: Bezpośredni, en: Direct}
    2: {pl: Ogrzewanie podłogowe, en: Floor heating}
    4: {pl: Basen, en: Swimming pool}
    10: {pl: Klimakonwektor, en: Fan convector}
  months: &months
    1: {pl: Styczeń, en: January}
    2: {pl: Luty, en: February}
    3: {pl: Marzec, en: March}
    4: {pl: Kwiecień, en: April}
    5: {pl: Maj, en: May}
    6: {pl: Czerwiec, en: June}
    7: {pl: Lipiec, en: July}
    8: {pl: Sierpień, en: August}
    9: {pl: Wrzesień, en: September}
    10: {pl: Październik, en: October}
    11: {pl: Listopad, en: November}
    12: {pl: Grudzień, en: December}

  stop_day: &stop_day {type: uint, kind: parameter, min: 1, max: 31, step: 1, group: stop_periods, enabled_by_default: false}
  stop_month: &stop_month {type: enum, kind: parameter, values: *months, group: stop_periods, enabled_by_default: false}
  energy_part: &energy_part {type: uint, kind: measure, state_class: total_increasing, group: service, enabled_by_default: false}
  solar_raw: &solar_raw {type: uint, group: solar, enabled_by_default: false}
  boiler_types: &boiler_types
    0: 3-25LP
    1: 3-15LP
    2: 3-25SOLO
    3: 3-25K
    4: 3-15SOLO
    5: 3-E25LP
    6: DOMOLIGHT
    7: "3-35"
    8: "3-50"
    9: 3-25 BIC
    10: 3-15ECO
    11: 3-25ECO
    12: 3-35ECO
    13: 3-50ECO
    14: 3-65ECO
    20: Diematic 3
    21: Diematic m2
    22: Diematic m3
    23: MIT
    24: D4
    25: {pl: Interfejs MB/OT, en: MB/OT interface}
    30: MC 35 E
    31: MC 45
    32: MC 65
    33: MC 90
    34: C210
    35: C310
    36: C610
    37: C230
    40: Robur HP

  boiler_errors: &boiler_errors
    0x0000: {pl: "D3: BŁ.CZ.ZASIL. B", en: "D3: Flow sensor B fault"}
    0x0001: {pl: "D4: BŁ.CZ.ZASIL. C", en: "D4: Flow sensor C fault"}
    0x0002: {pl: "D5: BŁ.CZ.ZEWN.", en: "D5: Outdoor sensor fault"}
    0x0003: {pl: "D7: BŁ.CZ.SYSTEMU", en: "D7: System sensor fault"}
    0x0004: {pl: "D9: BŁ.CZ.CWU", en: "D9: DHW sensor fault"}
    0x0005: {pl: "D11: BŁ.CZ.POKOJ. A", en: "D11: Room sensor A fault"}
    0x0006: {pl: "D12: BŁ.CZ.POKOJ. B", en: "D12: Room sensor B fault"}
    0x0007: {pl: "D13: BŁ.CZ.POKOJ. C", en: "D13: Room sensor C fault"}
    0x0008: {pl: "D14: BŁ.KOM. MC", en: "D14: MC communication fault"}
    0x0009: {pl: "D15: BŁ.CZ.BUFORA", en: "D15: Buffer sensor fault"}
    0x000A: {pl: "D16: BŁ.CZ.BASENU B", en: "D16: Pool sensor B fault"}
    0x000B: {pl: "D16: BŁ.CZ.BASENU C", en: "D16: Pool sensor C fault"}
    0x000C: {pl: "D17: BŁ.CZ.CWU 2", en: "D17: DHW sensor 2 fault"}
    0x000D: {pl: "D27: BŁ.KOM. PCU", en: "D27: PCU communication fault"}
    0x0012: {pl: "D32: 5 RESETÓW WŁ/WYŁ", en: "D32: 5 ON/OFF resets"}
    0x0013: {pl: "D37: TA-S ZWARCIE", en: "D37: TA-S short circuit"}
    0x0014: {pl: "D38: TA-S ODŁĄCZONA", en: "D38: TA-S disconnected"}
    0x0015: {pl: "D39: TA-S AWARIA", en: "D39: TA-S failure"}
    0x0016: {pl: "D50: BŁ.KOM. INNE", en: "D50: Other communication fault"}
