  - {key: dhw_electrical_energy, name: {pl: Energia elektryczna - CWU, en: Electrical energy DHW}, terms: [{key: dhw_energy_mwh, factor: 1000}, {key: dhw_energy_kwh}, {key: dhw_energy_wh, factor: 0.001}], unit: kWh, device_class: energy, state_class: total_increasing, group: service}
