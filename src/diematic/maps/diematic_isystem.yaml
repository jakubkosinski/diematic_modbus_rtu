registers:
  # Circuit A
  - {<<: *temp_setting, key: circuit_a_max_flow_temp, address: 299, name: {pl: Maks. temperatura obiegu A, en: Circuit A maximum flow temperature}, min: 30, max: 90, step: 1, group: circuit_a}
  - {<<: [*temp_setting, *room_setpoint], key: circuit_a_day_temp, address: 650, name: {pl: Temperatura dzień obiegu A, en: Circuit A day temperature}, group: circuit_a}
  - {<<: [*temp_setting, *room_setpoint], key: circuit_a_night_temp, address: 651, name: {pl: Temperatura noc obiegu A, en: Circuit A night temperature}, group: circuit_a}
  - {<<: *temp_setting, key: circuit_a_frost_temp, address: 652, name: {pl: Min. dopuszczalna temp. pokojowa obiegu A, en: Circuit A minimum room temperature (frost protection)}, min: 0.5, max: 20, step: 0.5, group: circuit_a}
  - {key: circuit_a_forcing, address: 653, type: bits, kind: parameter, name: {pl: Wymuszenie obiegu A i CWU, en: Circuit A and DHW forcing}, bits: *forcing_bits, poll: fast, group: circuit_a}
  - {<<: *curve_slope, key: circuit_a_curve_slope, address: 655, name: {pl: Krzywa grzewcza obiegu A, en: Circuit A heating curve slope}, group: circuit_a}
  - key: circuit_a_type
    address: 296
    type: enum
    kind: parameter
    name: {pl: Typ obiegu A, en: Circuit A type}
    group: circuit_a
    values:
      0: {pl: Wyłączony, en: "Off"}
      1: {pl: Bezpośredni, en: Direct}
      2: {pl: Ogrzewanie podłogowe, en: Floor heating}
      5: {pl: Program, en: Program}
      7: {pl: Wysoka temperatura, en: High temperature}
      10: {pl: Klimakonwektor, en: Fan convector}
      11: {pl: CWU, en: DHW}
      15: {pl: CWU elektryczna, en: Electric DHW}
  - {<<: *anticipation, key: circuit_a_anticipation, address: 282, name: {pl: Antycypacja obiegu A (10.1 = nie), en: Circuit A anticipation (10.1 = off)}, group: circuit_a}
  - {<<: [*temp_setting, *curve_base], key: circuit_a_curve_base_day, address: 289, name: {pl: Punkt bazowy krzywej (dzień) obiegu A, en: Circuit A heating curve base point (day)}, group: circuit_a}
  - {<<: [*temp_setting, *curve_base], key: circuit_a_curve_base_night, address: 290, name: {pl: Punkt bazowy krzywej (noc) obiegu A, en: Circuit A heating curve base point (night)}, group: circuit_a}
  - {<<: *program_select, key: circuit_a_active_program, address: 231, name: {pl: Aktualny program obiegu A, en: Circuit A active program}, group: circuit_a}
  - {<<: *temp_measure, key: circuit_a_room_temp, address: 614, name: {pl: Temperatura pokojowa obiegu A, en: Circuit A room temperature}, group: circuit_a}
  - {<<: *temp_measure, key: circuit_a_calculated_flow_temp, address: 615, name: {pl: Obliczona temp. zasilania obiegu A, en: Circuit A calculated flow temperature}, group: circuit_a}
  - {<<: *circuit_modes, key: circuit_a_mode, address: 637, name: {pl: Tryb pracy obiegu A, en: Circuit A operating mode}, group: circuit_a}

  # Circuit B
  - {<<: *temp_setting, key: circuit_b_min_flow_temp, address: 662, name: {pl: Min. temperatura obiegu B, en: Circuit B minimum flow temperature}, min: 10, max: 50, step: 1, group: circuit_b}
  - {<<: *temp_setting, key: circuit_b_max_flow_temp, address: 663, name: {pl: Maks. temperatura obiegu B, en: Circuit B maximum flow temperature}, min: 20, max: 95, step: 1, group: circuit_b}
  - {<<: [*temp_setting, *room_setpoint], key: circuit_b_day_temp, address: 656, name: {pl: Temperatura dzień obiegu B, en: Circuit B day temperature}, group: circuit_b}
  - {<<: [*temp_setting, *room_setpoint], key: circuit_b_night_temp, address: 657, name: {pl: Temperatura noc obiegu B, en: Circuit B night temperature}, group: circuit_b}
  - {<<: *temp_setting, key: circuit_b_frost_temp, address: 658, name: {pl: Min. dopuszczalna temp. pokojowa obiegu B, en: Circuit B minimum room temperature (frost protection)}, min: 0.5, max: 20, step: 0.1, group: circuit_b}
  - {key: circuit_b_forcing, address: 659, type: bits, kind: parameter, name: {pl: Wymuszenie obiegu B i CWU, en: Circuit B and DHW forcing}, bits: *forcing_bits, poll: fast, group: circuit_b}
  - {<<: *curve_slope, key: circuit_b_curve_slope, address: 661, name: {pl: Krzywa grzewcza obiegu B, en: Circuit B heating curve slope}, group: circuit_b}
  - {key: circuit_b_type, address: 297, type: enum, kind: parameter, name: {pl: Typ obiegu B, en: Circuit B type}, values: *pool_circuit_types, group: circuit_b}
  - {<<: *temp_setting, key: circuit_b_pool_temp, address: 686, name: {pl: Temperatura basenu obiegu B (0 = ochrona przeciwzamrożeniowa), en: Circuit B pool temperature (0 = frost protection)}, min: 0, max: 39, step: 5, group: circuit_b}
